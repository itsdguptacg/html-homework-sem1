<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1">
        <tr>
            <td></td>
            <th id="col-math" scope="col">Mathematics</th>
            <th id="col-science" scope="col">Science</th>
        </tr>
        <tr>
            <th id="row-alice" scope="row">Alice</th>
            <td headers="row-alice col-math">85</td>
            <td headers="row-alice col-science">92</td>
        </tr>
        <tr>
            <th id="row-bob" scope="row">Bob</th>
            <td headers="row-bob col-math">78</td>
            <td headers="row-bob col-science">81</td>
        </tr>
    </table>
</body>

</html>
