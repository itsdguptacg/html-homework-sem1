<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1">
        <caption>Q1 Sales Data</caption>
        <thead>
            <tr>
                <th id="qtr" scope="col">Quarter</th>
                <th id="mth" scope="col">Month</th>
                <th id="amt" scope="col">Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th id="q1" scope="row" rowspan="2">Q1</th>
                <td headers="q1 mth">Jan</td>
                <td headers="q1 amt">$100</td>
            </tr>
            <tr>
                <td headers="q1 mth">Feb</td>
                <td headers="q1 amt">$150</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th id="tot" scope="row" colspan="2">Total</th>
                <td headers="tot amt">$250</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
