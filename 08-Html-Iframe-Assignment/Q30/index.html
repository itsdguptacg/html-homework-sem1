<!DOCTYPE html>
<html>

<head>
    <title>Iframes Demo</title>
</head>

<body>
    <iframe src="https://www.example.com" width="48%" height="280" title="Normal Webpage"></iframe>

    <iframe src="https://device.example.com/interactive" width="100%" height="350" allow="fullscreen;gyroscope"
        allowfullscreen title="Interactive Demo"></iframe>

    <iframe src="https://device.example.com/control" width="48%" height="280" allow="usb"
        title="USB Device Control"></iframe>
</body>

</html>
