<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1">
        <caption>Internal Assessment Marks</caption>
        <thead>
            <tr>
                <th scope="col">Student Name</th>
                <th scope="col">Mathematics</th>
                <th scope="col">Science</th>
                <th scope="col">Total Score</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>45</td>
                <td>48</td>
                <td>93</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>40</td>
                <td>42</td>
                <td>82</td>
            </tr>
            <tr>
                <td>Charlie</td>
                <td>49</td>
                <td>50</td>
                <td>99</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3" scope="row">Highest Score</th>
                <td>99</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
